seed: 42
run_name: toy_flow_mvp
output_dir: outputs

data:
  num_samples: 4096
  horizon: 30
  state_dim: 8
  language_vocab:
    - keep lane smoothly
    - change lane left safely
    - change lane right safely
    - slow down and yield
  batch_size: 128

model:
  latent_dim: 128
  text_embed_dim: 32
  hidden_dim: 256
  flow_steps: 16

training:
  epochs: 5
  lr: 0.0003
  weight_decay: 0.0001
  device: auto
