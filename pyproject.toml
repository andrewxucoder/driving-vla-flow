[project]
name = "driving-vla-flow"
version = "0.1.0"
description = "Research prototype for Driving-VLA with Flow Matching trajectory generation."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]
